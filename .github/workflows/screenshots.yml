name: Prints da tela no emulador

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Liberar KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir a Eve no emulador e tirar prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      - name: Guardar os prints num branch (para ver sem baixar artefato)
        if: always()
        run: |
          set -e
          [ -d screens ] || exit 0
          git config user.name "eve-ci"
          git config user.email "eve-ci@users.noreply.github.com"
          dir="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          repo="$PWD"
          pub=$(mktemp -d)
          # Cada branch tem a sua pasta. Mantém as pastas dos outros branches (antes um apagava o outro)
          # e guarda tudo num commit só, para o repositório não crescer a cada rodada.
          for i in 1 2 3 4 5; do
            old=""
            if git fetch -q origin +refs/heads/ci-screenshots:refs/remotes/origin/ci-screenshots; then
              old=$(git rev-parse refs/remotes/origin/ci-screenshots)
            fi
            rm -rf "$pub" && mkdir -p "$pub"
            if [ -n "$old" ]; then git archive "$old" | tar -x -C "$pub"; fi
            rm -rf "$pub/$dir" && mkdir -p "$pub/$dir"
            cp -r screens/. "$pub/$dir/"
            idx=$(mktemp -u)
            tree=$(cd "$pub" && GIT_DIR="$repo/.git" GIT_WORK_TREE="$pub" GIT_INDEX_FILE="$idx" git add -A . \
              && GIT_DIR="$repo/.git" GIT_INDEX_FILE="$idx" git write-tree)
            commit=$(git commit-tree "$tree" -m "Prints de ${dir} (${GITHUB_SHA::7})")
            if git push --force-with-lease="refs/heads/ci-screenshots:${old}" origin "$commit:refs/heads/ci-screenshots"; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "Não consegui guardar os prints no branch ci-screenshots" && exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints
          path: screens
