name: Prints da tela no emulador

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Liberar KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir a Eve no emulador e tirar prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      - name: Guardar os prints num branch (para ver sem baixar artefato)
        if: always()
        run: |
          set -e
          [ -d screens ] || exit 0
          dest=$(mktemp -d)
          cp -r screens/. "$dest/"
          git config user.name "eve-ci"
          git config user.email "eve-ci@users.noreply.github.com"
          git fetch origin ci-screenshots || true
          git checkout --orphan ci-screenshots-tmp
          git rm -rf -q . || true
          rm -rf ./* .github || true
          dir="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          mkdir -p "$dir"
          cp -r "$dest/." "$dir/"
          git add "$dir"
          git commit -q -m "Prints de ${dir} (${GITHUB_SHA::7})"
          git push -f origin HEAD:refs/heads/ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints
          path: screens
